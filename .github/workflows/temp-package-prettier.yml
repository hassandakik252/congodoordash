name: Temporary Prettier Package

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  package-prettier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Package Prettier 3.8.4
        run: |
          mkdir -p /tmp/prettier-package
          cd /tmp/prettier-package
          npm pack prettier@3.8.4 --silent
      - name: Upload Prettier package
        uses: actions/upload-artifact@v4
        with:
          name: prettier-3.8.4-package
          path: /tmp/prettier-package/prettier-3.8.4.tgz
          retention-days: 1
          if-no-files-found: error
